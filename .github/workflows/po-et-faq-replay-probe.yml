name: po-et FAQ replay ownership probe

on:
  push:
    branches: [verify/faq-replay-ownership-20261029]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'po-et/WeKnora'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOGC: '50'
      GOMEMLIMIT: 3GiB
      GOFLAGS: -p=2
      LOG_LEVEL: warn
      WK_FAQ_REPLAY_PROBE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Observe archived replay versus replacement import
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go test -mod=readonly -race -count=1 -timeout=5m -v -run '^TestFAQReplayOwnershipProbe$' ./internal/application/service 2>&1 | tee replay-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faq-replay-ownership-evidence
          path: replay-probe.log
