name: FAQ admission verification

on:
  push:
    branches: [verify/faq-admission-20261029]

permissions:
  contents: read

concurrency:
  group: faq-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    if: github.repository == 'po-et/WeKnora'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOGC: '50'
      GOMEMLIMIT: 3GiB
      GOFLAGS: '-p=2'
      LOG_LEVEL: warn
      WK_FAQ_ADMISSION_HTTP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Baseline must expose replacement progress corruption
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/faq-admission-evidence"
          source_file=internal/application/service/knowledge_faq_import.go
          cp "$source_file" "$RUNNER_TEMP/faq-admission-fixed.go"
          trap 'cp "$RUNNER_TEMP/faq-admission-fixed.go" "$source_file"' EXIT
          git show 40192ace214ca046a86b590d69c1fe7286f3423e:"$source_file" > "$source_file"
          set +e
          go test -mod=readonly -race -count=1 -timeout=5m -v \
            -run '^(TestFAQImportRejectsSupersededInstance|TestFAQAdmissionHTTPProgressPreserved)$' \
            ./internal/application/service 2>&1 | tee "$RUNNER_TEMP/faq-admission-evidence/baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -q '^--- FAIL: TestFAQImportRejectsSupersededInstance' "$RUNNER_TEMP/faq-admission-evidence/baseline.log"
          grep -q '^--- FAIL: TestFAQAdmissionHTTPProgressPreserved' "$RUNNER_TEMP/faq-admission-evidence/baseline.log"
          grep -q 'FAQ_ADMISSION_HTTP phase=after_old_replay.*"status":"completed"' "$RUNNER_TEMP/faq-admission-evidence/baseline.log"
      - name: Fixed FAQ and tag regressions with race detector
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -race -count=1 -timeout=8m -v \
            -run '^(TestFAQ|TestTag)' ./internal/application/service \
            2>&1 | tee "$RUNNER_TEMP/faq-admission-evidence/fixed.log"
          grep -q '^--- PASS: TestFAQAdmissionHTTPProgressPreserved' "$RUNNER_TEMP/faq-admission-evidence/fixed.log"
          grep -q 'FAQ_ADMISSION_HTTP phase=after_old_replay.*"status":"pending"' "$RUNNER_TEMP/faq-admission-evidence/fixed.log"
      - name: Inspect exact upstream source candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git checkout --detach 89e346a921c76c89def8e57d4c7b677a5044b289
          git diff --check 40192ace214ca046a86b590d69c1fe7286f3423e...HEAD
          test -z "$(gofmt -l internal/application/service/knowledge_faq_import.go internal/application/service/knowledge_faq_admission_test.go)"
          git show --format=fuller --stat HEAD | tee "$RUNNER_TEMP/faq-admission-evidence/source.txt"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --new-from-rev=40192ace214ca046a86b590d69c1fe7286f3423e ./internal/application/service
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faq-admission-evidence
          path: ${{ runner.temp }}/faq-admission-evidence
          retention-days: 14
